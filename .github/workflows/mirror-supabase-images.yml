name: Mirror Supabase images to GHCR

# WHY THIS EXISTS (2026-09-29, run 36640718326)
# ---------------------------------------------------------------------------
# `.github/actions/supabase-start` pulls every Supabase service image from
# `public.ecr.aws/supabase/*` (the CLI's hardcoded default registry — see
# `GetRegistry()` / `defaultRegistry` in `internal/utils/docker.go` of the
# pinned `supabase` CLI). That registry is AWS ECR Public, and GitHub-hosted
# runners share a small pool of egress IPs against its anonymous-pull quota.
# Run 36640718326 failed a "Start Supabase local stack" step with:
#
#   Error toomanyrequests: Data limit exceeded
#
# — not Docker Hub, not a rate limit on request COUNT but on anonymous-pull
# DATA volume, and not something a `docker login` to Docker Hub could ever
# touch (the supabase-start action's own comment block already documents
# that a Docker Hub login changes nothing here).
#
# THE FIX: mirror the exact image set the pinned CLI needs to
# `ghcr.io/<owner>/supabase/<image>:<tag>`, authenticated with the calling
# workflow's own `GITHUB_TOKEN` — no new account, no new secret, no PO
# action. `.github/actions/supabase-start` then tries that mirror first and
# only falls back to `public.ecr.aws` if the mirror doesn't have what it
# needs, so this can never make a CI run WORSE than today.
#
# WHY THE IMAGE LIST IS DISCOVERED, NOT HARDCODED
# ---------------------------------------------------------------------------
# The Supabase CLI has no `--dry-run` / `--print-images` flag (checked
# against `cmd/start.go` for the pinned version) and resolves each service's
# exact image:tag from internal, per-release constants keyed by
# `supabase/config.toml`'s `db.major_version` — there is no CLI-version-proof
# way to compute those tags from outside the CLI. Hardcoding them here would
# repeat the exact mistake this repo already paid for once: the `inbucket`
# entry in `supabase-start`'s own `exclude` default silently went stale after
# an upstream rename to `mailpit` (see that action's long comment). So this
# job asks the CLI directly: it runs the SAME `supabase start --exclude …`
# ci.yml runs, against the untouched default registry, then reads back
# `docker images` for whatever `public.ecr.aws/supabase/*` refs actually got
# pulled. That list is exactly what `supabase-start` needs for THIS pinned
# CLI version and THIS `major_version` — nothing guessed, nothing stale.
#
# WHY A GHCR MARKER TAG, NOT A COMMITTED MANIFEST (revised 2026-09-30, review)
# ---------------------------------------------------------------------------
# The first cut of this file committed the resolved image list to
# `.github/actions/supabase-start/mirrored-images.txt` on `main` so the
# action could read it for free. A fresh review blocked that: this repo's
# `main` is Vercel's Production Branch (see `vercel-live-project-is-dim-
# staging` in project memory) — every push to it fires a production deploy
# AND a full `ci.yml` run, so a bot commit here would trigger both on every
# CLI bump, every week, forever, for a file nothing but this workflow reads.
#
# The fix is to make the READINESS SIGNAL itself live in the one place both
# sides already read: GHCR. After every image mirrors successfully, this job
# publishes one more cheap tag, `ghcr.io/<owner>/supabase/mirror-ready:cli-
# <version>-pg<major_version>` — an `imagetools create` alias pointing at the
# postgres manifest already pushed above (GHCR-to-GHCR, no ECR traffic, no
# new blobs). `.github/actions/supabase-start` computes that SAME key from
# `node_modules/supabase/package.json` and `supabase/config.toml` (both
# already on disk after its caller's own `pnpm install`, no CLI invocation
# needed) and probes for the tag with `docker buildx imagetools inspect`. The
# key carries `major_version` as well as the CLI version — a CLI unchanged
# but a `db.major_version` bump (13→15→17…) resolves a DIFFERENT postgres
# tag, and a marker keyed on CLI version alone would report "ready" for a
# postgres image the mirror never actually copied.
on:
  workflow_dispatch: {}
  schedule:
    # Weekly, off-peak UTC. A CLI bump between runs is caught by the
    # push-triggered run below; this is the "nothing changed but let's
    # re-confirm the mirror is intact" sweep.
    - cron: "27 4 * * 1"
  push:
    branches: [main]
    paths:
      # A `supabase` CLI bump (package.json/pnpm-lock.yaml) or a
      # `db.major_version` bump (supabase/config.toml) both change which
      # postgres tag `supabase start` resolves to, and therefore the
      # readiness marker's key.
      - "package.json"
      - "pnpm-lock.yaml"
      - "supabase/config.toml"
      - ".github/workflows/mirror-supabase-images.yml"

# Only one mirror run touches GHCR tags at a time.
concurrency:
  group: mirror-supabase-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror Supabase CLI's images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `schedule:` fires only from, and checks out, the default branch —
          # `pnpm lint:sched-refs` (scripts/check-scheduled-fence-refs.ts)
          # requires every scheduled workflow to pin it explicitly rather than
          # rely on that default silently. Same reasoning as every other
          # scheduled workflow in this repo (see mobile-export-nightly.yml).
          ref: main

      - name: Setup pnpm
        # No `version:` input — see ci.yml's own comment: the version comes
        # from the root package.json `packageManager` field.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the readiness marker's key
        # Both halves are knowable WITHOUT running `supabase start` — the
        # whole point, since `.github/actions/supabase-start` computes this
        # same key before deciding whether to touch the mirror at all.
        id: pin
        run: |
          set -euo pipefail
          cli_version=$(node -p "require('./node_modules/supabase/package.json').version")
          major=$(grep -m1 '^major_version' supabase/config.toml | grep -oE '[0-9]+' | head -n1)
          if [ -z "$cli_version" ] || [ -z "$major" ]; then
            echo "::error::could not resolve supabase CLI version ('${cli_version}') or supabase/config.toml's db.major_version ('${major}')."
            exit 1
          fi
          echo "marker_tag=cli-${cli_version}-pg${major}" >> "$GITHUB_OUTPUT"

      - name: Read the shared --exclude default from supabase-start
        # The exact same exclude set ci.yml's two jobs use, read out of the
        # action's own input default so this file is never a second place
        # that set has to be kept in sync by hand.
        id: exclude
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const yaml = fs.readFileSync(".github/actions/supabase-start/action.yml", "utf8");
          const match = yaml.match(/exclude:[\s\S]*?default:\s*([^\n]+)/);
          if (!match) {
            throw new Error(
              "could not find the `exclude` input's default in .github/actions/supabase-start/action.yml",
            );
          }
          console.log(`list=${match[1].trim()}`);
          NODE

      - name: Start Supabase against the default registry
        # Deliberately untouched: this is how we learn the exact image set,
        # so it must resolve against `public.ecr.aws` like `supabase-start`
        # does today. A small retry loop absorbs a transient
        # `toomanyrequests` here too — this job runs far less often than
        # every CI run, but it still shares the same throttled resource.
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=4
          backoff=15
          until pnpm exec supabase start --exclude "${{ steps.exclude.outputs.list }}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::supabase start failed on all ${max_attempts} attempt(s) while discovering the image list."
              exit 1
            fi
            echo "::warning::supabase start attempt ${attempt}/${max_attempts} failed; retrying in ${backoff}s."
            pnpm exec supabase stop --no-backup >/dev/null 2>&1 || true
            sleep "$backoff"
            backoff=$((backoff * 2))
            attempt=$((attempt + 1))
          done

      - name: List the images this CLI version actually pulled
        run: |
          set -euo pipefail
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^public\.ecr\.aws/supabase/' \
            | sort -u > /tmp/supabase-images.txt
          if [ ! -s /tmp/supabase-images.txt ]; then
            echo "::error::no public.ecr.aws/supabase/* images found after supabase start — nothing to mirror."
            exit 1
          fi
          echo "Images to mirror:"
          cat /tmp/supabase-images.txt

      - name: Stop the local stack
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Mirror each image to GHCR (retag + push what supabase start already pulled)
        # `docker buildx imagetools create` against a `public.ecr.aws` source
        # would refetch the manifest AND every blob from ECR even though
        # `supabase start` just pulled all of it into this runner's local
        # Docker daemon — spending the exact anonymous-pull volume this whole
        # job exists to stop spending. `docker tag` + `docker push` reuse
        # what is already local: zero extra ECR traffic. This publishes
        # linux/amd64 only, which is what a `supabase start` on THIS runner
        # actually pulled — sufficient because the only consumer is
        # `supabase-start` on GitHub-hosted (linux/amd64) runners, never an
        # end user's own machine.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="${OWNER,,}"
          while IFS= read -r src; do
            name_tag="${src#public.ecr.aws/supabase/}"
            dest="ghcr.io/${owner_lc}/supabase/${name_tag}"

            if docker buildx imagetools inspect "$dest" >/dev/null 2>&1; then
              echo "skip (already mirrored): $dest"
              continue
            fi

            docker tag "$src" "$dest"

            attempt=1
            max_attempts=5
            backoff=10
            until docker push "$dest"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::failed to push ${dest} after ${max_attempts} attempt(s) (toomanyrequests or another registry error)."
                exit 1
              fi
              echo "::warning::push attempt ${attempt}/${max_attempts} for ${dest} failed; retrying in ${backoff}s."
              sleep "$backoff"
              backoff=$((backoff * 2))
              attempt=$((attempt + 1))
            done
            echo "mirrored: ${src} -> ${dest}"
          done < /tmp/supabase-images.txt

      - name: Publish the readiness marker
        # Anchored to postgres: it can never be in `--exclude` (see
        # supabase-start's own `exclude` input description — it is not in
        # the CLI's excludable list), so it is guaranteed to be in
        # /tmp/supabase-images.txt and already pushed by the step above.
        # This `imagetools create` call is GHCR source -> GHCR dest, so it
        # touches no ECR traffic either.
        env:
          OWNER: ${{ github.repository_owner }}
          MARKER_TAG: ${{ steps.pin.outputs.marker_tag }}
        run: |
          set -euo pipefail
          owner_lc="${OWNER,,}"
          pg_line=$(grep '/postgres:' /tmp/supabase-images.txt | head -n1)
          if [ -z "$pg_line" ]; then
            echo "::error::no postgres:<tag> entry found in the discovered image list — cannot anchor the readiness marker."
            exit 1
          fi
          pg_name_tag="${pg_line#public.ecr.aws/supabase/}"
          src="ghcr.io/${owner_lc}/supabase/${pg_name_tag}"
          dest="ghcr.io/${owner_lc}/supabase/mirror-ready:${MARKER_TAG}"

          attempt=1
          max_attempts=5
          backoff=10
          until docker buildx imagetools create --tag "$dest" "$src"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::failed to publish the readiness marker ${dest} after ${max_attempts} attempt(s)."
              exit 1
            fi
            echo "::warning::marker publish attempt ${attempt}/${max_attempts} failed; retrying in ${backoff}s."
            sleep "$backoff"
            backoff=$((backoff * 2))
            attempt=$((attempt + 1))
          done
          echo "readiness marker published: ${dest} -> ${src}"

  # `pnpm lint:sched-refs` (scripts/check-scheduled-fence-refs.ts) requires
  # every `schedule:`-triggered workflow to wire this or list a reasoned
  # exemption — CONTRIBUTING.md's rule that a scheduled fence's first-ever
  # red run must not go unnoticed just because there was no prior green to
  # transition from. A silently-red mirror is the same failure mode this
  # whole file exists to close: `supabase-start` would fall back to
  # `public.ecr.aws` forever and nobody would know why until the ECR
  # throttle bit again.
  alert:
    name: Alert on a red streak
    needs: mirror
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Local composite actions resolve from the checked-out tree, so this
          # job needs the same pin as the one above.
          ref: main

      - name: Open or update the alert issue
        uses: ./.github/actions/red-streak-alert
        with:
          workflow: mirror-supabase-images.yml
          outcome: ${{ needs.mirror.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[mirror] Supabase image mirror to GHCR is failing"
