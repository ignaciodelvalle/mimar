<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="miMAR" style="color:#0E5A99">
  <title>miMAR — Mi Mascota Argentina</title>
  <!--
    Round 3 ("chaflán 10, pata +6%", PO-approved). Still the same idea as
    round 1: a QR finder pattern with chamfered corners, holding a paw — the
    three corner squares of a QR code are the pattern a camera hunts for
    before it can read anything else, so borrowing that outline keeps the
    mark legible at 16px by construction.

    Why the chamfer shrank from ~29% to 10 units. The first cut (corner cut
    at 26/74 of a 100-unit frame, roughly 29% of the half-width) read as a
    stop-sign octagon once the mark was scaled down to a 16px favicon — the
    corners ate enough of the square that the shape's silhouette stopped
    reading as "a rounded plaque" and started reading as "a traffic sign".
    A 10-unit chamfer keeps the engraved-plaque / struck-seal character (still
    cut, not rounded — that vocabulary is deliberate, see below) while
    leaving enough flat edge on each side that the plaque, not the octagon,
    is what small sizes see first. The frame wall is uniform on the straights
    and the diagonals by construction (the inner chamfer is derived so the
    diagonal wall equals the straight wall), the same invariant round 1 held.

    Why chamfered and not rounded, unchanged from round 1: a cut corner is
    the language of an engraved plaque and a struck seal; a large corner
    radius is the language of a phone app. The product is a registry, so the
    corners are cut.

    The paw, redrawn. Round 1's paw was four exact circles on a mirrored
    axis over a symmetrical pad — constructed, but noticeably geometric next
    to the organic frame. Round 3 redraws it as a single organic paw pad
    (modelled on a dog's, understood per the PO's 2026-09-03 decision as the
    universal pet-paw glyph — see "Deliberately NOT species-specific" below),
    built from closed C2 cubic splines so no anchor point breaks the
    curvature, then scaled up 6% ("pata +6%") so it reads as a paw and not a
    blot once knocked down to a 16px favicon. It sits on the counter's
    optical centre (the bounding-box centre blended 0.35 toward the shape's
    area centroid, then nudged 0.4 units higher) rather than its geometric
    centre, which is what keeps it looking centred to an eye instead of a
    ruler.

    The whole mark — frame plus paw — is ONE evenodd path: the outer
    chamfered square, the inner chamfered counter (a genuine knockout, not a
    second fill), and the paw's four toe pads plus main pad, all wound so a
    single fill-rule renders the finished plaque. There is a second file,
    logo-mimar-mark-small.svg, drawn independently at a coarser chamfer for
    surfaces at or under 24px (the favicon among them) — swapping paths
    between the two is not a matter of scaling one and using it for both.

    Colour. `currentColor` throughout, with the brand blue as the root
    default, so an inline <svg> inherits the surrounding colour (knockout on
    dark grounds costs nothing) while an <img src> still renders in brand
    blue. The blue is the primary colour token from app/globals.css (its CSS
    custom-property name cannot be written here: XML forbids a doubled
    hyphen inside a comment); it is restated below as a literal because an
    asset in public/ cannot import a token.

    Deliberately NOT species-specific. The concept recorded in
    dim-interno:docs/plans/PENDIENTES.md required two distinguishable
    silhouettes, a dog and a cat. That constraint was retired by the PO on
    2026-09-03: it is in direct conflict with the 16px constraint in the same
    list, and a paw is common to both species. One shape, both animals,
    legible small.
  -->
  <path fill="currentColor" fill-rule="evenodd" d="M15 5H85L95 15V85L85 95H15L5 85V15ZM20.8 19H79.2L81 20.8V79.2L79.2 81H20.8L19 79.2V20.8ZM42 30.92C43.58 30.68 45.31 31.1 46.56 32.38C47.8 33.67 48.55 35.81 48.67 37.92C48.78 40.03 48.26 42.09 47.38 43.66C46.5 45.23 45.27 46.29 43.91 46.49C42.55 46.68 41.08 45.99 39.81 44.67C38.54 43.35 37.49 41.39 37.15 39.33C36.81 37.28 37.18 35.13 38.08 33.6C38.99 32.08 40.42 31.17 42 30.92ZM57.98 30.06C59.59 30.31 61.05 31.43 61.88 33.09C62.71 34.75 62.91 36.96 62.47 38.98C62.03 41.01 60.95 42.85 59.66 44.18C58.37 45.51 56.86 46.32 55.43 46.15C54.01 45.98 52.65 44.83 51.85 43.15C51.06 41.48 50.82 39.28 51.08 37.18C51.34 35.08 52.1 33.08 53.36 31.76C54.62 30.45 56.37 29.82 57.98 30.06ZM27.7 40.36C28.81 39.46 30.45 39.09 31.98 39.61C33.52 40.12 34.96 41.5 35.95 43.11C36.93 44.71 37.46 46.53 37.48 48.12C37.49 49.7 36.99 51.06 36.02 51.81C35.06 52.56 33.62 52.71 32.06 52.21C30.5 51.71 28.82 50.56 27.68 49.11C26.55 47.66 25.97 45.89 25.98 44.3C25.99 42.7 26.59 41.26 27.7 40.36ZM71.69 39.8C72.9 40.59 73.8 41.87 73.93 43.48C74.07 45.09 73.44 47.04 72.32 48.56C71.19 50.08 69.57 51.18 68.02 51.75C66.47 52.32 65.01 52.36 63.96 51.7C62.91 51.04 62.28 49.68 62.18 48.04C62.08 46.4 62.52 44.47 63.47 42.81C64.42 41.16 65.9 39.77 67.41 39.24C68.92 38.7 70.47 39.01 71.69 39.8ZM50.23 47.71C52.56 47.72 54.9 48.39 57.06 49.51C59.22 50.63 61.19 52.19 62.71 54.07C64.23 55.94 65.3 58.13 65.64 60.22C65.97 62.3 65.58 64.29 64.47 65.83C63.36 67.37 61.54 68.47 59.1 68.48C56.67 68.5 53.6 67.45 50.43 67.42C47.25 67.4 43.96 68.4 41.36 68.38C38.76 68.36 36.84 67.31 35.7 65.73C34.55 64.15 34.18 62.04 34.53 59.9C34.88 57.75 35.97 55.57 37.55 53.75C39.13 51.93 41.21 50.46 43.4 49.4C45.6 48.35 47.9 47.7 50.23 47.71Z"/>
</svg>
